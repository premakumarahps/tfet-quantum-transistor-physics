<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="quantumGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="barrierGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Base with Subtle Border -->
  <rect width="200" height="200" rx="42" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Semiconductor Lattice Grid Lines -->
  <g opacity="0.15" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="30" y1="50" x2="170" y2="50" />
    <line x1="30" y1="100" x2="170" y2="100" />
    <line x1="30" y1="150" x2="170" y2="150" />
    <line x1="50" y1="30" x2="50" y2="170" />
    <line x1="100" y1="30" x2="100" y2="170" />
    <line x1="150" y1="30" x2="150" y2="170" />
  </g>

  <!-- Top Gate Electrode (V_G) -->
  <rect x="75" y="42" width="50" height="14" rx="4" fill="#1e293b" />
  <rect x="78" y="58" width="44" height="6" rx="2" fill="#06b6d4" />
  <text x="100" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">GATE (V<tspan font-size="8" dy="2">G</tspan>)</text>

  <!-- Central Potential Energy Barrier (CLASSICALLY FORBIDDEN REGION) -->
  <rect x="88" y="74" width="24" height="64" rx="5" fill="url(#barrierGrad)" stroke="#be123c" stroke-width="1.5" />
  <text x="100" y="110" font-family="monospace" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-90 100 110)">V(x)</text>

  <!-- Incident Wavefunction (Left Region 1, E > V) -->
  <path d="M 28 106 Q 42 76, 56 106 T 84 106 L 88 106" fill="none" stroke="url(#quantumGlow)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Evanescent Decay Inside Barrier (Region 2, E < V) -->
  <path d="M 88 106 Q 96 112, 112 115" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-dasharray="2 2" stroke-linecap="round"/>

  <!-- Transmitted Wavefunction (Right Region 3, T = |F|^2) -->
  <path d="M 112 115 Q 126 95, 140 115 T 168 115" fill="none" stroke="url(#quantumGlow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- Tunneling Electron Quantum Wavepacket Dot -->
  <circle cx="114" cy="115" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>

  <!-- Labels for p+ Source and n+ Drain -->
  <rect x="30" y="148" width="36" height="18" rx="5" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="48" y="161" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#4338ca" text-anchor="middle">p<tspan dy="-3" font-size="8">+</tspan><tspan dy="3"> Src</tspan></text>

  <rect x="134" y="148" width="36" height="18" rx="5" fill="#ccfbf1" stroke="#99f6e4"/>
  <text x="152" y="161" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0f766e" text-anchor="middle">n<tspan dy="-3" font-size="8">+</tspan><tspan dy="3"> Drn</tspan></text>

  <!-- Tunneling Subthreshold Arrow (Sub-60 mV/dec) -->
  <path d="M 52 82 L 148 82" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <circle cx="100" cy="82" r="3" fill="#8b5cf6" />
</svg>
